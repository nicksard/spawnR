# Builds the AppSleep Android app (android-appsleep/) and publishes the APK to the
# "appsleep-latest" release so it can be downloaded straight onto a phone.
name: AppSleep APK

on:
  push:
    paths:
      - 'android-appsleep/**'
      - '.github/workflows/appsleep-apk.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-appsleep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AppSleep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppSleep-apk
          path: android-appsleep/AppSleep.apk

      - name: Publish to the appsleep-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appsleep-latest
          target_commitish: ${{ github.sha }}
          name: AppSleep (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest build of AppSleep from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone, tap **AppSleep.apk** below to download and install it.
            See android-appsleep/README.md for setup steps.
          files: android-appsleep/AppSleep.apk
